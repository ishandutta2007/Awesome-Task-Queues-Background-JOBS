<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic Animations */
    @keyframes queueFlow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes packetMove1 {
      0% { cx: 120; cy: 75; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 480; cy: 75; opacity: 0; }
    }
    @keyframes packetMove2 {
      0% { cx: 720; cy: 75; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 1080; cy: 75; opacity: 0; }
    }
    @keyframes packetMove3 {
      0% { cx: 180; cy: 285; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 1020; cy: 285; opacity: 0; }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .pipeline-line {
      stroke-dasharray: 8 12;
      animation: queueFlow 6s linear infinite;
    }
    .packet-1 { animation: packetMove1 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .packet-2 { animation: packetMove2 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.6s; }
    .packet-3 { animation: packetMove3 4.5s linear infinite 0.8s; }
    .status-dot { animation: statusBlink 2.2s ease-in-out infinite; }
    .ambient-pulse {
      transform-origin: 50% 30%;
      animation: pulseGlow 5s ease-in-out infinite;
    }
    .pill-group { animation: badgeFloat 4s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" fill="url(#ambientGlow)" class="ambient-pulse"/>

  <!-- Subtle Circuit / Queuing Grid Lines (Background Graphic) -->
  <g opacity="0.18">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#c084fc" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 7"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 7"/>
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 7"/>
  </g>

  <!-- Dynamic Animated Pipeline Top Track -->
  <g opacity="0.65">
    <!-- Producer Node (Left) -->
    <rect x="70" y="55" width="100" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="85" cy="75" r="4" fill="#38bdf8" class="status-dot"/>
    <text x="125" y="79" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">PRODUCER</text>

    <!-- Top Track Path -->
    <line x1="170" y1="75" x2="520" y2="75" stroke="#38bdf8" stroke-width="2" class="pipeline-line"/>

    <!-- Central Queue Dispatcher -->
    <rect x="520" y="55" width="160" height="40" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" filter="url(#subtleGlow)"/>
    <circle cx="538" cy="75" r="4" fill="#10b981" class="status-dot"/>
    <text x="608" y="79" fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="middle">TASK BROKER / QUEUE</text>

    <!-- Track Path to Worker -->
    <line x1="680" y1="75" x2="1030" y2="75" stroke="#c084fc" stroke-width="2" class="pipeline-line"/>

    <!-- Consumer / Worker Node (Right) -->
    <rect x="1030" y="55" width="100" height="40" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="1045" cy="75" r="4" fill="#f472b6" class="status-dot"/>
    <text x="1085" y="79" fill="#fbcfe8" font-size="12" font-weight="600" text-anchor="middle">WORKER</text>

    <!-- Dynamic Flowing Job Packets -->
    <circle cx="120" cy="75" r="5" fill="#38bdf8" filter="url(#glowEffect)" class="packet-1"/>
    <circle cx="720" cy="75" r="5" fill="#c084fc" filter="url(#glowEffect)" class="packet-2"/>
  </g>

  <!-- Dynamic Bottom Job Stream Line -->
  <g opacity="0.5">
    <line x1="120" y1="285" x2="1080" y2="285" stroke="url(#lineGlow)" stroke-width="2" class="pipeline-line"/>
    <circle cx="180" cy="285" r="4" fill="#818cf8" filter="url(#glowEffect)" class="packet-3"/>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, and Feature Badges -->
  <!-- Dark Vignette behind text to guarantee 100% foreground contrast and legibility -->
  <rect x="160" y="115" width="880" height="145" rx="16" fill="#090d16" fill-opacity="0.82" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Main Category / Tagline Pill -->
  <g transform="translate(600, 142)">
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="-120" cy="-1" r="3.5" fill="#10b981" class="status-dot"/>
    <text x="5" y="3" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED RESOURCE REGISTRY</text>
  </g>

  <!-- Title -->
  <text x="600" y="196" fill="url(#titleGradient)" font-size="34" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#subtleGlow)">
    Awesome Task Queues &amp; Background Jobs
  </text>

  <!-- Subtitle -->
  <text x="600" y="232" fill="#cbd5e1" font-size="15" font-weight="500" letter-spacing="0.2" text-anchor="middle">
    Durable Workflows • Distributed Job Processing • Asynchronous Message Brokers
  </text>

  <!-- Feature Pills Group (Foreground Bottom) -->
  <g class="pill-group" transform="translate(600, 316)">
    <!-- Pill 1 -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="-13" width="175" height="26" rx="13" fill="#111827" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8"/>
      <text x="87" y="4" fill="#7dd3fc" font-size="12" font-weight="600" text-anchor="middle">⚡ Durable Execution</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="-13" width="180" height="26" rx="13" fill="#111827" stroke="#818cf8" stroke-width="1" stroke-opacity="0.8"/>
      <text x="90" y="4" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle">⏱️ Distributed Workers</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(5, 0)">
      <rect x="0" y="-13" width="185" height="26" rx="13" fill="#111827" stroke="#c084fc" stroke-width="1" stroke-opacity="0.8"/>
      <text x="92" y="4" fill="#d8b4fe" font-size="12" font-weight="600" text-anchor="middle">🔄 Async Job Pipelines</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(210, 0)">
      <rect x="0" y="-13" width="180" height="26" rx="13" fill="#111827" stroke="#f472b6" stroke-width="1" stroke-opacity="0.8"/>
      <text x="90" y="4" fill="#fbcfe8" font-size="12" font-weight="600" text-anchor="middle">📦 Message Queues</text>
    </g>
  </g>
</svg>
