<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#080c18"/></linearGradient><linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="40%" stop-color="#818cf8"/><stop offset="80%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="lineGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".2"/></linearGradient><radialGradient id="ambientGlow" cx="50%" cy="30%" r="65%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".18"/><stop offset="60%" stop-color="#8b5cf6" stop-opacity=".06"/><stop offset="100%" stop-color="#090d16" stop-opacity="0"/></radialGradient><filter id="glowEffect" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="2"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes queueFlow{0%{stroke-dashoffset:240}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.04)}}@keyframes packetMove1{0%{cx:120;cy:75;opacity:0}15%,85%{opacity:1}}@keyframes packetMove2{0%{cx:720;cy:75;opacity:0}15%,85%{opacity:1}}@keyframes packetMove3{0%{cx:180;cy:285;opacity:0}15%,85%{opacity:1}}@keyframes statusBlink{0%{opacity:.9}50%{opacity:.3}}@keyframes badgeFloat{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}.pipeline-line{stroke-dasharray:8 12;animation:queueFlow 6s linear infinite}.packet-1{animation:packetMove1 3.2s cubic-bezier(.4,0,.2,1) infinite}.packet-2{animation:packetMove2 3.2s cubic-bezier(.4,0,.2,1) infinite 1.6s}.packet-3{animation:packetMove3 4.5s linear infinite .8s}.status-dot{animation:statusBlink 2.2s ease-in-out infinite}.ambient-pulse{transform-origin:50% 30%;animation:pulseGlow 5s ease-in-out infinite}.pill-group{animation:badgeFloat 4s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGradient)"/><rect width="1200" height="360" fill="url(#ambientGlow)" class="ambient-pulse"/><g opacity=".18"><line x1="0" x2="1200" y1="90" y2="90" stroke="#38bdf8" stroke-width="1"/><line x1="0" x2="1200" y1="180" y2="180" stroke="#818cf8" stroke-dasharray="4 6" stroke-width="1"/><line x1="0" x2="1200" y1="270" y2="270" stroke="#c084fc" stroke-width="1"/><line x1="200" x2="200" y1="0" y2="360" stroke="#38bdf8" stroke-dasharray="3 7" stroke-width="1"/><line x1="600" x2="600" y1="0" y2="360" stroke="#818cf8" stroke-dasharray="3 7" stroke-width="1"/><line x1="1000" x2="1000" y1="0" y2="360" stroke="#c084fc" stroke-dasharray="3 7" stroke-width="1"/></g><g opacity=".65"><rect width="100" height="40" x="70" y="55" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/><circle cx="85" cy="75" r="4" fill="#38bdf8" class="status-dot"/><text x="125" y="79" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">PRODUCER</text><line x1="170" x2="520" y1="75" y2="75" stroke="#38bdf8" stroke-width="2" class="pipeline-line"/><rect width="160" height="40" x="520" y="55" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" filter="url(#subtleGlow)" rx="8"/><circle cx="538" cy="75" r="4" fill="#10b981" class="status-dot"/><text x="608" y="79" fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="middle">TASK BROKER / QUEUE</text><line x1="680" x2="1030" y1="75" y2="75" stroke="#c084fc" stroke-width="2" class="pipeline-line"/><rect width="100" height="40" x="1030" y="55" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" rx="8"/><circle cx="1045" cy="75" r="4" fill="#f472b6" class="status-dot"/><text x="1085" y="79" fill="#fbcfe8" font-size="12" font-weight="600" text-anchor="middle">WORKER</text><circle cx="120" cy="75" r="5" fill="#38bdf8" class="packet-1" filter="url(#glowEffect)"/><circle cx="720" cy="75" r="5" fill="#c084fc" class="packet-2" filter="url(#glowEffect)"/></g><g opacity=".5"><line x1="120" x2="1080" y1="285" y2="285" stroke="url(#lineGlow)" stroke-width="2" class="pipeline-line"/><circle cx="180" cy="285" r="4" fill="#818cf8" class="packet-3" filter="url(#glowEffect)"/></g><rect width="880" height="145" x="160" y="115" fill="#090d16" fill-opacity=".82" stroke="#334155" stroke-opacity=".5" stroke-width="1" rx="16"/><g transform="translate(600, 142)"><rect width="280" height="26" x="-140" y="-14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="13"/><circle cx="-120" cy="-1" r="3.5" fill="#10b981" class="status-dot"/><text x="5" y="3" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED RESOURCE REGISTRY</text></g><text x="600" y="196" fill="url(#titleGradient)" filter="url(#subtleGlow)" font-size="34" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Task Queues &amp; Background Jobs</text><text x="600" y="232" fill="#cbd5e1" font-size="15" font-weight="500" letter-spacing=".2" text-anchor="middle">Durable Workflows • Distributed Job Processing • Asynchronous Message Brokers</text><g class="pill-group"><g transform="translate(600, 316) translate(-390, 0)"><rect width="175" height="26" x="0" y="-13" fill="#111827" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1" rx="13"/><text x="87" y="4" fill="#7dd3fc" font-size="12" font-weight="600" text-anchor="middle">⚡ Durable Execution</text></g><g transform="translate(600, 316) translate(-195, 0)"><rect width="180" height="26" x="0" y="-13" fill="#111827" stroke="#818cf8" stroke-opacity=".8" stroke-width="1" rx="13"/><text x="90" y="4" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle">⏱️ Distributed Workers</text></g><g transform="translate(600, 316) translate(5, 0)"><rect width="185" height="26" x="0" y="-13" fill="#111827" stroke="#c084fc" stroke-opacity=".8" stroke-width="1" rx="13"/><text x="92" y="4" fill="#d8b4fe" font-size="12" font-weight="600" text-anchor="middle">🔄 Async Job Pipelines</text></g><g transform="translate(600, 316) translate(210, 0)"><rect width="180" height="26" x="0" y="-13" fill="#111827" stroke="#f472b6" stroke-opacity=".8" stroke-width="1" rx="13"/><text x="90" y="4" fill="#fbcfe8" font-size="12" font-weight="600" text-anchor="middle">📦 Message Queues</text></g></g></svg>